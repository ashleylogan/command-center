/* ---------- events ---------- */
function attachEvents(){
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.tab = el.getAttribute('data-tab'); render(); });
  });

  const resetDataBtn = document.getElementById('reset-data-btn');
  if(resetDataBtn) resetDataBtn.addEventListener('click', ()=>{
    if(resetArmed) doReset(); else armReset();
  });

  const downloadBackupBtn = document.getElementById('download-backup-btn');
  if(downloadBackupBtn) downloadBackupBtn.addEventListener('click', downloadBackup);

  const restoreBackupBtn = document.getElementById('restore-backup-btn');
  const restoreFileInput = document.getElementById('restore-file-input');
  if(restoreBackupBtn && restoreFileInput){
    restoreBackupBtn.addEventListener('click', ()=> restoreFileInput.click());
    restoreFileInput.addEventListener('change', (e)=>{
      restoreFromFile(e.target.files[0]);
      restoreFileInput.value = '';
    });
  }

  const focusToggleBtn = document.getElementById('focus-toggle-btn');
  if(focusToggleBtn) focusToggleBtn.addEventListener('click', ()=>{
    state.focusMode = !state.focusMode;
    render();
  });
  const showFullDash = document.getElementById('show-full-dash');
  if(showFullDash) showFullDash.addEventListener('click', ()=>{
    state.focusMode = false;
    render();
  });
  document.querySelectorAll('[data-focus-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const amt = parseFloat(document.getElementById('focus-amount').value);
      if(!amt || amt<=0) return;
      const category = el.getAttribute('data-focus-cat');
      state.txns.push({id: state.nextId.txn++, date: isoDate(today), category, amount: amt, note:''});
      render();
    });
  });

  document.querySelectorAll('[data-spend-sub]').forEach(el=>{
    el.addEventListener('click', ()=>{
      spendingSubView = el.getAttribute('data-spend-sub');
      render();
    });
  });
  const toggleTxnForm = document.getElementById('toggle-txn-form');
  if(toggleTxnForm) toggleTxnForm.addEventListener('click', ()=>{ showTxnForm = true; render(); });
  const cancelTxnForm = document.getElementById('cancel-txn-form');
  if(cancelTxnForm) cancelTxnForm.addEventListener('click', ()=>{ showTxnForm = false; render(); });

  const toggleSavingForm = document.getElementById('toggle-saving-form');
  if(toggleSavingForm) toggleSavingForm.addEventListener('click', ()=>{ showSavingForm = true; render(); });
  const cancelSavingForm = document.getElementById('cancel-saving-form');
  if(cancelSavingForm) cancelSavingForm.addEventListener('click', ()=>{ showSavingForm = false; render(); });

  const toggleBudgetForm = document.getElementById('toggle-budget-form');
  if(toggleBudgetForm) toggleBudgetForm.addEventListener('click', ()=>{ showBudgetForm = true; render(); });
  const cancelBudgetForm = document.getElementById('cancel-budget-form');
  if(cancelBudgetForm) cancelBudgetForm.addEventListener('click', ()=>{ showBudgetForm = false; render(); });

  const toggleCategoryManager = document.getElementById('toggle-category-manager');
  if(toggleCategoryManager) toggleCategoryManager.addEventListener('click', ()=>{ showCategoryManager = true; render(); });
  const cancelCategoryManager = document.getElementById('cancel-category-manager');
  if(cancelCategoryManager) cancelCategoryManager.addEventListener('click', ()=>{ showCategoryManager = false; render(); });

  const setBudget = document.getElementById('set-budget');
  if(setBudget) setBudget.addEventListener('click', ()=>{
    const cat = document.getElementById('new-budget-cat').value;
    const amt = parseFloat(document.getElementById('new-budget-amount').value);
    if(!amt || amt<=0) return;
    state.categoryBudgets[cat] = amt;
    showBudgetForm = false;
    render();
  });
  document.querySelectorAll('[data-del-budget]').forEach(el=>{
    el.addEventListener('click', ()=>{
      delete state.categoryBudgets[el.getAttribute('data-del-budget')];
      render();
    });
  });

  const addCategory = document.getElementById('add-category');
  if(addCategory) addCategory.addEventListener('click', ()=>{
    const name = document.getElementById('new-category-name').value.trim();
    if(!name) return;
    if(state.expenseCategories.some(c=>c.toLowerCase()===name.toLowerCase())) return;
    state.expenseCategories.push(name);
    render();
  });
  const removeCategory = document.getElementById('remove-category');
  if(removeCategory) removeCategory.addEventListener('click', ()=>{
    const cat = document.getElementById('category-select').value;
    if(!cat) return;
    if(state.expenseCategories.length <= 1) return;
    state.expenseCategories = state.expenseCategories.filter(c=>c!==cat);
    delete state.categoryBudgets[cat];
    render();
  });

  const toggleIncomeForm = document.getElementById('toggle-income-form');
  if(toggleIncomeForm) toggleIncomeForm.addEventListener('click', ()=>{ showIncomeForm = true; render(); });
  const cancelIncomeForm = document.getElementById('cancel-income-form');
  if(cancelIncomeForm) cancelIncomeForm.addEventListener('click', ()=>{ showIncomeForm = false; render(); });
  const addIncome = document.getElementById('add-income');
  if(addIncome) addIncome.addEventListener('click', ()=>{
    const amount = parseFloat(document.getElementById('new-income-amount').value);
    if(!amount || amount<=0) return;
    const source = document.getElementById('new-income-source').value;
    const note = document.getElementById('new-income-note').value.trim();
    const date = document.getElementById('new-income-date').value || isoDate(today);
    state.income.push({id: state.nextId.income++, date, source, amount, note});
    showIncomeForm = false;
    render();
  });
  document.querySelectorAll('[data-del-income]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.income = state.income.filter(i=>i.id!==Number(el.getAttribute('data-del-income')));
      render();
    });
  });

  document.querySelectorAll('[data-edit-ledger]').forEach(el=>{
    el.addEventListener('click', ()=>{
      editingLedgerKey = el.getAttribute('data-edit-ledger');
      render();
    });
  });
  const cancelLedgerEdit = document.getElementById('cancel-ledger-edit');
  if(cancelLedgerEdit) cancelLedgerEdit.addEventListener('click', ()=>{
    editingLedgerKey = null;
    render();
  });
  document.querySelectorAll('[data-save-ledger]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [kind, idStr] = el.getAttribute('data-save-ledger').split(':');
      const id = Number(idStr);
      const amount = parseFloat(document.getElementById('edit-ledger-amt').value);
      if(!amount || amount<=0) return;
      const label = document.getElementById('edit-ledger-cat').value;
      const date = document.getElementById('edit-ledger-date').value || isoDate(today);
      const note = document.getElementById('edit-ledger-note').value.trim();
      if(kind==='expense'){
        const t = state.txns.find(x=>x.id===id);
        if(t){ t.amount=amount; t.category=label; t.date=date; t.note=note; }
      } else {
        const i = state.income.find(x=>x.id===id);
        if(i){ i.amount=amount; i.source=label; i.date=date; i.note=note; }
      }
      editingLedgerKey = null;
      render();
    });
  });

  document.querySelectorAll('[data-habit-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = Number(el.getAttribute('data-habit-toggle'));
      const date = el.getAttribute('data-date');
      const h = state.habits.find(x=>x.id===id);
      h.log[date] = !h.log[date];
      render();
    });
  });

  document.querySelectorAll('[data-goal-slider]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const id = Number(el.getAttribute('data-goal-slider'));
      const g = state.goals.find(x=>x.id===id);
      g.pct = Number(el.value);
      render();
    });
  });

  document.querySelectorAll('[data-goal-complete]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = Number(el.getAttribute('data-goal-complete'));
      const g = state.goals.find(x=>x.id===id);
      g.pct = g.pct === 100 ? 0 : 100;
      render();
    });
  });

  document.querySelectorAll('[data-del-goal]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.goals = state.goals.filter(g=>g.id!==Number(el.getAttribute('data-del-goal')));
      render();
    });
  });
  document.querySelectorAll('[data-del-habit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const delId = Number(el.getAttribute('data-del-habit'));
      state.habits = state.habits.filter(h=>h.id!==delId);
      if(editingHabitId === delId) editingHabitId = null;
      render();
    });
  });
  document.querySelectorAll('[data-del-txn]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.txns = state.txns.filter(t=>t.id!==Number(el.getAttribute('data-del-txn')));
      render();
    });
  });

  const addGoal = document.getElementById('add-goal');
  if(addGoal) addGoal.addEventListener('click', ()=>{
    const title = document.getElementById('new-goal-title').value.trim();
    if(!title) return;
    const note = document.getElementById('new-goal-note').value.trim();
    const due = document.getElementById('new-goal-due').value || null;
    const view = state.goalsView;
    const period = view.period === 'year' ? (Math.floor(today.getMonth()/3)+1) : view.period;
    const quarter = `Q${period} ${view.year}`;
    state.goals.push({id: state.nextId.goal++, title, pct:0, quarter, note, due});
    render();
  });

  document.querySelectorAll('[data-period-target]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const target = el.getAttribute('data-period-target');
      const [yearStr, periodStr] = el.value.split('-');
      const view = { goals: state.goalsView, habits: state.habitsView, spending: state.spendingView }[target];
      view.year = Number(yearStr);
      view.period = periodStr === 'year' ? 'year' : Number(periodStr);
      render();
    });
  });

  const addHabit = document.getElementById('add-habit');
  if(addHabit) addHabit.addEventListener('click', ()=>{
    const name = document.getElementById('new-habit-name').value.trim();
    if(!name) return;
    const freqVal = document.getElementById('new-habit-freq').value;
    const target = freqVal === 'daily' ? 'daily' : Number(freqVal);
    state.habits.push({id: state.nextId.habit++, name, log:{}, target});
    render();
  });

  document.querySelectorAll('[data-move-habit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = Number(el.getAttribute('data-move-habit'));
      const dir = Number(el.getAttribute('data-dir'));
      const idx = state.habits.findIndex(h=>h.id===id);
      const swapIdx = idx+dir;
      if(swapIdx<0 || swapIdx>=state.habits.length) return;
      [state.habits[idx], state.habits[swapIdx]] = [state.habits[swapIdx], state.habits[idx]];
      render();
    });
  });

  document.querySelectorAll('[data-week-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const delta = Number(el.getAttribute('data-week-nav'));
      habitWeekOffset = Math.max(0, habitWeekOffset + delta);
      render();
    });
  });

  document.querySelectorAll('[data-edit-habit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      editingHabitId = Number(el.getAttribute('data-edit-habit'));
      render();
      const input = document.getElementById('edit-habit-input');
      if(input){ input.focus(); input.select(); }
    });
  });

  document.querySelectorAll('[data-save-habit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = Number(el.getAttribute('data-save-habit'));
      const input = document.getElementById('edit-habit-input');
      const name = input.value.trim();
      const h = state.habits.find(x=>x.id===id);
      if(name) h.name = name;
      editingHabitId = null;
      render();
    });
  });
  const editInput = document.getElementById('edit-habit-input');
  if(editInput) editInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      const saveBtn = document.querySelector('[data-save-habit]');
      if(saveBtn) saveBtn.click();
    }
  });

  const addTxn = document.getElementById('add-txn');
  if(addTxn) addTxn.addEventListener('click', ()=>{
    const amount = parseFloat(document.getElementById('new-txn-amount').value);
    if(!amount || amount<=0) return;
    const category = document.getElementById('new-txn-cat').value;
    const note = document.getElementById('new-txn-note').value.trim();
    const date = document.getElementById('new-txn-date').value || isoDate(today);
    state.txns.push({id: state.nextId.txn++, date, category, amount, note});
    showTxnForm = false;
    render();
  });

  const addSaving = document.getElementById('add-saving');
  if(addSaving) addSaving.addEventListener('click', ()=>{
    const name = document.getElementById('new-saving-name').value.trim();
    const target = parseFloat(document.getElementById('new-saving-target').value);
    const due = document.getElementById('new-saving-due').value || null;
    if(!name || !target || target<=0) return;
    state.savings.push({id: state.nextId.saving++, name, target, saved:0, due});
    showSavingForm = false;
    render();
  });

  document.querySelectorAll('[data-add-contrib]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = Number(el.getAttribute('data-add-contrib'));
      const input = document.getElementById('contrib-'+id);
      const amt = parseFloat(input.value);
      if(!amt || amt<=0) return;
      const s = state.savings.find(x=>x.id===id);
      s.saved += amt;
      render();
    });
  });

  document.querySelectorAll('[data-del-saving]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const delId = Number(el.getAttribute('data-del-saving'));
      state.savings = state.savings.filter(s=>s.id!==delId);
      if(editingSavingId === delId) editingSavingId = null;
      render();
    });
  });

  document.querySelectorAll('[data-edit-saving]').forEach(el=>{
    el.addEventListener('click', ()=>{
      editingSavingId = Number(el.getAttribute('data-edit-saving'));
      render();
    });
  });
  const cancelSavingEdit = document.getElementById('cancel-saving-edit');
  if(cancelSavingEdit) cancelSavingEdit.addEventListener('click', ()=>{
    editingSavingId = null;
    render();
  });
  document.querySelectorAll('[data-save-saving]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = Number(el.getAttribute('data-save-saving'));
      const s = state.savings.find(x=>x.id===id);
      if(!s) return;
      const name = document.getElementById('edit-saving-name').value.trim();
      const target = parseFloat(document.getElementById('edit-saving-target').value);
      const saved = parseFloat(document.getElementById('edit-saving-saved').value);
      const due = document.getElementById('edit-saving-due').value || null;
      if(!name || !target || target<=0) return;
      s.name = name;
      s.target = target;
      s.saved = isNaN(saved) ? s.saved : saved;
      s.due = due;
      editingSavingId = null;
      render();
    });
  });

  document.querySelectorAll('[data-emoji]').forEach(el=>{
    el.addEventListener('click', ()=>{
      dreamEmoji = el.getAttribute('data-emoji');
      document.querySelectorAll('[data-emoji]').forEach(c=>c.classList.remove('selected'));
      el.classList.add('selected');
    });
  });

  const addDream = document.getElementById('add-dream');
  if(addDream) addDream.addEventListener('click', ()=>{
    const text = document.getElementById('new-dream-text').value.trim();
    if(!text) return;
    state.dreams.push({id: state.nextId.dream++, emoji: dreamEmoji, text});
    dreamEmoji = '✨';
    render();
  });

  document.querySelectorAll('[data-del-dream]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.dreams = state.dreams.filter(d=>d.id!==Number(el.getAttribute('data-del-dream')));
      render();
    });
  });
}
function openQuickSheet(){
  document.getElementById('quicksheet').classList.remove('hidden');
  renderQuickSheet();
}
function closeQuickSheet(){
  document.getElementById('quicksheet').classList.add('hidden');
}
function renderQuickSheet(){
  const undone = state.habits.filter(h=>!h.log[isoDate(today)]);
  const sheet = document.getElementById('quicksheet');
  sheet.innerHTML = `
    <div class="qs-backdrop" id="qs-backdrop"></div>
    <div class="qs-panel">
      <div class="qs-handle"></div>
      <div class="qs-title">Quick add</div>
      <div class="qs-label">Habits left today</div>
      ${undone.length ? undone.map(h=>`
        <div class="qs-habit-row" data-qs-habit="${h.id}">
          <span class="name">${escapeHtml(h.name)}</span>
          <span class="qs-check"></span>
        </div>
      `).join('') : '<div class="qs-empty">All habits done for today ✓</div>'}
      <div class="qs-label">Log an expense</div>
      <input type="number" class="qs-amount-input" id="qs-amount" placeholder="Amount" step="0.01">
      <div class="qs-chip-row">
        ${state.expenseCategories.map(c=>`<button class="qs-chip" data-qs-cat="${c}">${c}</button>`).join('')}
      </div>
      <button class="qs-close-btn" id="qs-close">Close</button>
    </div>
  `;
  document.getElementById('qs-backdrop').addEventListener('click', closeQuickSheet);
  document.getElementById('qs-close').addEventListener('click', closeQuickSheet);
  sheet.querySelectorAll('[data-qs-habit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = Number(el.getAttribute('data-qs-habit'));
      const h = state.habits.find(x=>x.id===id);
      h.log[isoDate(today)] = true;
      renderQuickSheet();
      render();
    });
  });
  sheet.querySelectorAll('[data-qs-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const amt = parseFloat(document.getElementById('qs-amount').value);
      if(!amt || amt<=0) return;
      const category = el.getAttribute('data-qs-cat');
      state.txns.push({id: state.nextId.txn++, date: isoDate(today), category, amount: amt, note:''});
      closeQuickSheet();
      render();
    });
  });
}
document.getElementById('fab').addEventListener('click', openQuickSheet);

/* ---------- persistence ---------- */
const STORAGE_KEY = 'life-command-center-state';
let saveTimer = null;
let storageAvailable = true;

// --- Cloud sync (optional) ---
// Fill these in with your own Supabase project's values to enable real
// account-based sync. Leave them as-is to keep using on-device storage only.
const SUPABASE_URL = 'https://rckwiityldesihkxtbzv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJja3dpaXR5bGRlc2loa3h0Ynp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMDYzNjUsImV4cCI6MjEwNDc4MjM2NX0.h-8IHudj7oDM5IHlKuEGKdif5eBsjGN89Na9Zo1jIUE';
const cloudConfigured = SUPABASE_URL !== 'YOUR_SUPABASE_URL' && SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY';
let supabaseClient = (cloudConfigured && typeof window !== 'undefined' && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
let currentUser = null;
let skippedAuth = false;

function cloudActive(){
  return !!(supabaseClient && currentUser && !skippedAuth);
}

// Uses (in priority order): a signed-in Supabase account, Claude's artifact
// storage (viewing this inside claude.ai), or standard browser localStorage —
// so the exact same file works hosted anywhere and installed to a phone.
const hasArtifactStorage = (typeof window !== 'undefined') && !!window.storage;

async function storageGet(key){
  if(cloudActive()){
    const { data, error } = await supabaseClient
      .from('app_state').select('data').eq('user_id', currentUser.id).maybeSingle();
    if(error) throw error;
    if(!data) throw new Error('not found');
    return { key, value: JSON.stringify(data.data) };
  }
  if(hasArtifactStorage) return await window.storage.get(key, false);
  const v = localStorage.getItem(key);
  if(v === null) throw new Error('not found');
  return { key, value: v };
}
async function storageSet(key, value){
  if(cloudActive()){
    const { error } = await supabaseClient
      .from('app_state')
      .upsert({ user_id: currentUser.id, data: JSON.parse(value), updated_at: new Date().toISOString() });
    if(error) throw error;
    return { key, value };
  }
  if(hasArtifactStorage) return await window.storage.set(key, value, false);
  localStorage.setItem(key, value);
  return { key, value };
}
async function storageDelete(key){
  if(cloudActive()){
    const { error } = await supabaseClient.from('app_state').delete().eq('user_id', currentUser.id);
    if(error) throw error;
    return;
  }
  if(hasArtifactStorage) return await window.storage.delete(key, false);
  localStorage.removeItem(key);
}

async function saveStateToStorage(attempt){
  attempt = attempt || 1;
  try{
    await storageSet(STORAGE_KEY, JSON.stringify(state));
    setSaveStatus('saved');
  } catch(err){
    console.error('Save attempt ' + attempt + ' failed:', err);
    if(attempt < 3){
      setSaveStatus('retrying');
      setTimeout(()=>saveStateToStorage(attempt+1), attempt * 1200); // 1.2s, then 2.4s
    } else {
      setSaveStatus('error');
    }
  }
}

function scheduleSave(){
  if(!storageAvailable) return;
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveStateToStorage(1), 150);
}

function flushSaveNow(){
  // Best-effort synchronous-as-possible save, used right before the page
  // unloads/refreshes so a pending debounced save doesn't get lost.
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  try{
    if(hasArtifactStorage){
      // Async storage can't be guaranteed to finish before unload, but fire it anyway.
      window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
  } catch(err){ /* best effort only */ }
}
window.addEventListener('beforeunload', flushSaveNow);
window.addEventListener('pagehide', flushSaveNow);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden') flushSaveNow();
});

function setSaveStatus(status){
  const el = document.getElementById('save-status');
  if(!el) return;
  if(status === 'saved'){
    el.textContent = 'Saved';
    el.className = 'save-status ok';
  } else if(status === 'retrying'){
    el.textContent = 'Saving…';
    el.className = 'save-status';
  } else if(status === 'error'){
    el.textContent = "Couldn't save — your changes are still here, but may not survive closing the app";
    el.className = 'save-status err';
  } else {
    el.textContent = '';
  }
}

async function loadState(){
  try{
    const result = await storageGet(STORAGE_KEY);
    if(result && result.value){
      state = JSON.parse(result.value);
    }
  } catch(err){
    // No saved data yet (first run), or storage isn't reachable in this context.
    // Either way, keep the seeded default state already in `state` and continue.
  }
  render();
}

let resetArmed = false;
function armReset(){
  resetArmed = true;
  render();
  setTimeout(()=>{ if(resetArmed){ resetArmed = false; render(); } }, 4000);
}
async function doReset(){
  resetArmed = false;
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  try{
    await storageDelete(STORAGE_KEY);
  } catch(err){ /* nothing saved yet, ignore */ }
  // Reset in-memory state directly rather than relying solely on page reload,
  // since reload behavior can vary inside a sandboxed artifact viewer.
  state = makeDefaultState();
  render();
  try{ location.reload(); } catch(err){ /* ignore if reload isn't available here */ }
}

function setBackupStatus(text, kind){
  const el = document.getElementById('backup-status');
  if(!el) return;
  el.textContent = text;
  el.className = 'backup-status' + (kind ? ' '+kind : '');
}

function downloadBackup(){
  try{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `command-center-backup-${isoDate(today)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setBackupStatus('Backup downloaded', 'ok');
  } catch(err){
    console.error('Backup download failed:', err);
    setBackupStatus("Couldn't create the backup file", 'err');
  }
}

function looksLikeValidBackup(obj){
  return !!(obj && typeof obj === 'object'
    && Array.isArray(obj.goals) && Array.isArray(obj.habits)
    && Array.isArray(obj.txns) && Array.isArray(obj.savings)
    && Array.isArray(obj.dreams) && obj.nextId);
}

function restoreFromFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!looksLikeValidBackup(parsed)){
        setBackupStatus("That file doesn't look like a Command Center backup", 'err');
        return;
      }
      state = parsed;
      render();
      setBackupStatus('Restored from backup', 'ok');
    } catch(err){
      console.error('Restore failed:', err);
      setBackupStatus("Couldn't read that file", 'err');
    }
  };
  reader.onerror = ()=> setBackupStatus("Couldn't read that file", 'err');
  reader.readAsText(file);
}

function setAuthStatus(text, kind){
  const el = document.getElementById('auth-status');
  if(!el) return;
  el.textContent = text;
  el.className = 'auth-status' + (kind ? ' '+kind : '');
}

function showAuthGate(sub){
  const gate = document.getElementById('auth-gate');
  if(gate) gate.classList.remove('hidden');
  const subEl = document.getElementById('auth-sub');
  if(subEl && sub) subEl.textContent = sub;
}
function hideAuthGate(){
  const gate = document.getElementById('auth-gate');
  if(gate) gate.classList.add('hidden');
}

async function sendMagicLink(){
  const email = document.getElementById('auth-email').value.trim();
  if(!email || !email.includes('@')){
    setAuthStatus('Enter a valid email address', 'err');
    return;
  }
  setAuthStatus('Sending…');
  try{
    const { error } = await supabaseClient.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.href }
    });
    if(error) throw error;
    setAuthStatus('');
    document.getElementById('auth-check-msg').classList.remove('hidden');
  } catch(err){
    console.error('Sign-in link failed:', err);
    setAuthStatus("Couldn't send the link — try again", 'err');
  }
}

function wireAuthGateEvents(){
  const sendBtn = document.getElementById('auth-send-link');
  if(sendBtn) sendBtn.addEventListener('click', sendMagicLink);
  const skipBtn = document.getElementById('auth-skip');
  if(skipBtn) skipBtn.addEventListener('click', ()=>{
    skippedAuth = true;
    hideAuthGate();
    document.getElementById('main').innerHTML = '<p class="empty">Loading your data…</p>';
    loadState();
  });
}

async function startApp(){
  wireAuthGateEvents();

  if(!cloudConfigured || !supabaseClient){
    // No cloud project configured — behave exactly as before (artifact storage / localStorage).
    document.getElementById('main').innerHTML = '<p class="empty">Loading your data…</p>';
    loadState();
    return;
  }

  let appStarted = false;
  const beginLoadingApp = ()=>{
    if(appStarted) return;
    appStarted = true;
    hideAuthGate();
    document.getElementById('main').innerHTML = '<p class="empty">Loading your data…</p>';
    loadState();
  };

  supabaseClient.auth.onAuthStateChange((event, session)=>{
    if(session && session.user){
      currentUser = session.user;
      beginLoadingApp();
    }
  });

  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session && session.user){
    currentUser = session.user;
    beginLoadingApp();
  } else {
    showAuthGate();
  }
}

startApp();
</script>
