<style>
  :root{
    --paper:#EDE8DD;
    --panel:#F7F4EB;
    --ink:#24211D;
    --ink-soft:#6B6355;
    --line:#CFC6AE;
    --line-soft:#DED6C1;
    --gold:#A87F2E;
    --gold-bg:#F1E7D2;
    --teal:#35635C;
    --teal-bg:#DEE9E6;
    --rust:#8C4232;
    --rust-bg:#EDDCD5;
    --sage:#4F6B4D;
    --sage-bg:#DFE7DC;
    --plum:#6B4A73;
    --plum-bg:#E7DEE9;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:#DAD3C2;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 12px;
    min-height:100vh;
  }
  .phone{
    width:100%;
    max-width:400px;
    background:var(--paper);
    border-radius:28px;
    border:1px solid #C7BEA9;
    box-shadow:0 20px 50px rgba(30,25,15,0.25);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:800px;
  }
  .statusbar{
    height:14px;
    background:var(--paper);
  }
  header{
    padding:22px 22px 14px;
    border-bottom:1px solid var(--line);
  }
  header .eyebrow{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 2px;
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .save-status{
    font-size:10.5px;
    color:var(--ink-soft);
    margin:5px 0 0;
    min-height:13px;
    opacity:0.7;
  }
  .save-status.err{color:#A5291E;opacity:1;}
  .settings-footer{
    margin-top:22px;
    padding-top:14px;
    border-top:1px solid var(--line);
    text-align:center;
  }
  .reset-link{
    background:none;border:none;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    color:var(--ink-soft);
    opacity:0.6;
    cursor:pointer;
    padding:6px;
  }
  .reset-link.armed{
    color:#A5291E;
    opacity:1;
    font-weight:600;
  }
  .backup-row{margin-bottom:8px;}
  .backup-link{
    background:none;border:none;
    font-family:'Inter',sans-serif;
    font-size:12px;font-weight:600;
    color:var(--teal);
    cursor:pointer;
    padding:6px;
  }
  .settings-divider{color:var(--line);font-size:12px;margin:0 2px;}
  .backup-status{
    font-size:11px;color:var(--ink-soft);
    min-height:14px;margin:0 0 10px;
  }
  .backup-status.err{color:#A5291E;}
  .backup-status.ok{color:var(--sage);}
  main{
    flex:1;
    overflow-y:auto;
    padding:18px 22px 90px;
  }
  main::-webkit-scrollbar{width:0;}

  /* section heading */
  .section-title{
    font-family:'Fraunces',serif;
    font-size:18px;
    font-weight:500;
    margin:22px 0 10px;
  }
  .section-title:first-child{margin-top:0;}

  /* Dashboard */
  .quarter-strip{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:4px;
  }
  .quarter-strip .qlabel{font-size:13px;color:var(--ink-soft);}
  .stat-row{
    display:flex;
    gap:10px;
    margin-bottom:6px;
  }
  .stat-card{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    padding:14px 14px 12px;
  }
  .stat-card .num{
    font-family:'Fraunces',serif;
    font-size:24px;
    font-weight:500;
    line-height:1;
  }
  .stat-card .label{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .stat-card.hero{text-align:center;padding:20px 14px 18px;}
  .stat-card.hero .num{font-size:36px;}
  .stat-card.hero .label{font-size:12.5px;margin-top:8px;}
  .dash-block{
    border-top:1px solid var(--line);
    padding-top:14px;
    margin-top:18px;
  }
  .dash-block h3{
    font-size:14px;
    font-weight:600;
    margin:0 0 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .dash-block h3 .tag{
    font-size:11px;
    font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .mini-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid var(--line-soft);
    font-size:14px;
  }
  .mini-row:last-child{border-bottom:none;}
  .mini-habit-dot{
    width:18px;height:18px;border-radius:50%;
    border:1.5px solid var(--teal);
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .mini-habit-dot.done{background:var(--teal);}
  .mini-habit-dot.done::after{content:"✓";color:#fff;font-size:11px;}

  /* Goals */
  .goal-card{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
  }
  .goal-top{display:flex;justify-content:space-between;gap:8px;}
  .goal-title{font-size:15px;font-weight:600;}
  .goal-pct{font-family:'Fraunces',serif;color:var(--gold);font-size:15px;}
  .goal-check{
    width:22px;height:22px;border-radius:50%;
    border:1.5px solid var(--gold);flex-shrink:0;
    cursor:pointer;margin-top:2px;
    display:flex;align-items:center;justify-content:center;
  }
  .goal-check.done{background:var(--gold);}
  .goal-check.done::after{content:"✓";color:#fff;font-size:12px;}
  .goal-card.goal-done .goal-title{text-decoration:line-through;color:var(--ink-soft);}
  .goal-card.goal-done .goal-note{opacity:0.6;}
  .goal-note{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .bar-track{
    height:5px;background:var(--gold-bg);border-radius:4px;margin-top:10px;overflow:hidden;
  }
  .bar-fill{height:100%;background:var(--gold);}
  .goal-controls{
    display:flex;align-items:center;gap:8px;margin-top:10px;
  }
  .goal-controls input[type=range]{flex:1;accent-color:var(--gold);}
  .del-x{
    color:var(--ink-soft);
    font-size:12px;
    cursor:pointer;
    border:none;background:none;
    padding:4px;
  }
  .goal-meta{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:9px;
  }
  .due-pill{
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .due-pill.soon{color:var(--rust);}
  .due-pill.overdue{color:var(--rust);text-decoration:underline;text-decoration-style:dotted;}
  .due-date{
    font-size:11px;
    color:var(--ink-soft);
  }

  /* Period dropdown */
  .period-select-wrap{
    display:flex;justify-content:center;
    margin-bottom:16px;
  }
  select.period-select{
    appearance:none;-webkit-appearance:none;
    font-family:'Fraunces',serif;
    font-size:16px;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px 30px 8px 14px;
    cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B6355' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:14px;
  }
  select.period-select:focus{outline:1px solid var(--ink-soft);}

  /* Snapshot grid */
  .snap-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:6px;
  }

  /* Dashboard mini savings bar */
  .mini-bar-row{padding:9px 0;border-bottom:1px solid var(--line-soft);}
  .mini-bar-row:last-child{border-bottom:none;}
  .mini-bar-label{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px;}
  .mini-track{height:5px;background:var(--sage-bg);border-radius:4px;overflow:hidden;}
  .mini-fill{height:100%;background:var(--sage);}

  /* Dreams (vision board) */
  .dream-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .dream-card{
    border-radius:var(--radius);
    padding:16px 14px;
    min-height:104px;
    display:flex;flex-direction:column;justify-content:space-between;
    position:relative;
  }
  .dream-emoji{font-size:22px;line-height:1;}
  .dream-text{font-size:13.5px;font-weight:600;line-height:1.35;margin-top:10px;}
  .dream-card .del-x{position:absolute;top:6px;right:6px;}
  .dream-card.gold{background:var(--gold-bg);color:#5c451a;}
  .dream-card.teal{background:var(--teal-bg);color:#203d38;}
  .dream-card.rust{background:var(--rust-bg);color:#5c2c20;}
  .dream-card.sage{background:var(--sage-bg);color:#30422e;}
  .dream-card.plum{background:var(--plum-bg);color:#3f2c44;}
  .emoji-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .emoji-chip{
    width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--line);
    background:#fff;
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .emoji-chip.selected{border-color:var(--plum);background:var(--plum-bg);}
  .btn.plum{background:var(--plum);}
  .dream-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .dream-chip{
    flex-shrink:0;
    width:112px;
    border-radius:var(--radius);
    padding:12px 12px 10px;
  }
  .dream-chip .dream-emoji{font-size:18px;}
  .dream-chip .dream-text{font-size:12px;margin-top:8px;}

  /* Savings */
  .savings-card{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
  }
  .savings-top{display:flex;justify-content:space-between;gap:8px;}
  .savings-name{font-size:15px;font-weight:600;}
  .savings-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .savings-amt{font-family:'Fraunces',serif;color:var(--sage);font-size:15px;}
  .savings-controls{
    display:flex;align-items:center;gap:8px;margin-top:10px;
  }
  .savings-controls input[type=number]{
    flex:1;
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:8px 9px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    color:var(--ink);
  }
  .btn.sage{background:var(--sage);}
  .btn.small{width:auto;padding:8px 14px;font-size:12.5px;}

  /* Habits */
  .habit-card{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
  }
  .habit-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .habit-name-row{display:flex;align-items:center;gap:6px;}
  .habit-name{font-size:15px;font-weight:600;}
  .habit-name-input{
    font-family:'Inter',sans-serif;font-size:15px;font-weight:600;
    border:1px solid var(--teal);border-radius:var(--radius);
    padding:3px 6px;color:var(--ink);width:150px;
  }
  .icon-btn{
    background:none;border:none;color:var(--ink-soft);
    cursor:pointer;padding:2px;display:inline-flex;
  }
  .icon-btn svg{width:13px;height:13px;}
  .freq-pill{
    display:inline-block;
    font-size:10.5px;font-weight:600;
    color:var(--ink-soft);
    background:var(--paper);
    border:1px solid var(--line-soft);
    border-radius:10px;
    padding:2px 8px;
    margin-top:4px;
  }
  .habit-streak{font-size:12px;color:var(--ink-soft);margin-top:5px;line-height:1.5;}
  .week-nav{
    display:flex;align-items:center;justify-content:center;gap:12px;
    margin-bottom:12px;
  }
  .week-nav .icon-btn{
    border:1px solid var(--line);border-radius:50%;
    width:24px;height:24px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--ink-soft);
  }
  .week-nav .icon-btn:disabled{opacity:0.3;cursor:default;}
  .week-nav-label{font-family:'Fraunces',serif;font-size:14.5px;min-width:120px;text-align:center;}
  .reorder-col{display:flex;flex-direction:column;gap:2px;}
  .reorder-col .icon-btn:disabled{opacity:0.25;cursor:default;}
  .streak-badge{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-family:'Fraunces',serif;
    font-size:14px;
    color:var(--ink-soft);
    background:var(--teal-bg);
    border-radius:12px;
    padding:3px 9px 3px 7px;
  }
  .streak-badge svg{opacity:0.4;}
  .streak-badge.lit{color:var(--teal);}
  .streak-badge.lit svg{color:var(--teal);opacity:1;}
  .week-row{display:flex;gap:6px;margin-top:12px;}
  .day-box{
    flex:1;
    text-align:center;
    font-size:10px;
    color:var(--ink-soft);
  }
  .day-box .day-num{font-size:9px;color:var(--ink-soft);opacity:0.75;margin-top:1px;}
  .day-dot{
    width:26px;height:26px;border-radius:50%;
    border:1.5px solid var(--teal);
    margin:0 auto 4px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .day-dot.done{background:var(--teal);}
  .day-dot.done::after{content:"✓";color:#fff;font-size:12px;}
  .day-dot.future{opacity:0.35;cursor:default;}
  .heatmap-label{font-size:11px;color:var(--ink-soft);margin:12px 0 6px;}
  .heatmap{display:flex;flex-direction:column;gap:3px;}
  .heat-row{display:flex;gap:3px;}
  .heat-cell{
    flex:1;
    min-width:0;
    height:9px;
    border-radius:2px;
    background:var(--line-soft);cursor:default;
    display:flex;align-items:center;justify-content:center;
    transition:transform 0.08s ease;
  }
  .heat-cell.done{background:var(--teal);}
  .heat-cell.blank{background:transparent;}
  .heat-cell:not(.blank){cursor:pointer;}
  .heat-cell:not(.blank):active{transform:scale(0.85);}

  /* Spending */
  .segmented{display:flex;gap:6px;margin-bottom:18px;}
  .segment-btn{
    flex:1;padding:9px 0;text-align:center;
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    color:var(--ink-soft);background:var(--panel);
    border:1px solid var(--line-soft);border-radius:var(--radius);
    cursor:pointer;
  }
  .segment-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .add-toggle{
    display:block;text-align:center;
    font-size:12.5px;font-weight:600;color:var(--ink-soft);
    padding:10px;cursor:pointer;
    border:1px dashed var(--line);border-radius:var(--radius);
    margin-bottom:16px;
  }
  .spend-summary{
    display:flex;gap:10px;margin-bottom:18px;
  }
  .cat-bar-row{
    margin-bottom:10px;
  }
  .cat-bar-label{
    display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;
  }
  .cat-track{height:8px;background:var(--rust-bg);border-radius:4px;overflow:hidden;}
  .cat-fill{height:100%;background:var(--rust);}
  .cat-fill.over{background:#A5291E;}
  .cat-sub{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .cat-sub.over{color:#A5291E;font-weight:600;}
  .budget-row{margin-bottom:14px;}
  .txn-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--line-soft);
    font-size:14px;
  }
  .txn-left .txn-cat{font-weight:600;}
  .txn-left .txn-note{font-size:12px;color:var(--ink-soft);}
  .txn-amt{font-family:'Fraunces',serif;color:var(--rust);}
  .txn-row-edit{
    background:var(--panel);border:1px solid var(--teal);border-radius:var(--radius);
    padding:12px;margin-bottom:8px;
  }
  .txn-row-edit input, .txn-row-edit select{
    width:100%;font-family:'Inter',sans-serif;font-size:13.5px;

<script>
/* ---------- state (in-memory only) ---------- */
const today = new Date();
function isoDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n){return '$' + n.toFixed(2).replace(/\.00$/,'');}
function currentQuarter(d=today){return 'Q' + (Math.floor(d.getMonth()/3)+1) + ' ' + d.getFullYear();}
function parseQuarter(qStr){
  const m = qStr.match(/Q(\d)\s+(\d{4})/);
  return m ? { period: Number(m[1]), year: Number(m[2]) } : null;
}
function labelForView(view){
  return view.period === 'year' ? String(view.year) : `Q${view.period} ${view.year}`;
}
function periodOptionsHTML(view){
  const nowY = today.getFullYear();
  const nowQ = Math.floor(today.getMonth()/3)+1;
  let html='';
  for(let y=nowY; y<=nowY+1; y++){
    html += `<optgroup label="${y}">`;
    const startQ = (y===nowY) ? nowQ : 1;
    for(let p=startQ; p<=4; p++){
      const sel = (view.year===y && view.period===p) ? 'selected' : '';
      html += `<option value="${y}-${p}" ${sel}>Q${p} ${y}</option>`;
    }
    if(y > nowY){
      const selY = (view.year===y && view.period==='year') ? 'selected' : '';
      html += `<option value="${y}-year" ${selY}>${y} · Full year</option>`;
    }
    html += `</optgroup>`;
  }
  return html;
}
function periodRange(year, period){
  if(period==='year') return {start:new Date(year,0,1), end:new Date(year,11,31)};
  const startMonth = (period-1)*3;
  return {start:new Date(year,startMonth,1), end:new Date(year,startMonth+3,0)};
}
function periodStats(habit, view){
  const {start,end} = periodRange(view.year, view.period);
  const todayD = new Date(isoDate(today)+'T00:00:00');
  const isCurrent = todayD>=start && todayD<=end;
  if(start > todayD) return {completed:0, possible:0, best:0, isCurrent:false};
  const clipEnd = end < todayD ? end : todayD;
  let completed=0, possible=0, best=0, run=0;
  for(let d=new Date(start); d<=clipEnd; d.setDate(d.getDate()+1)){
    possible++;
    if(habit.log[isoDate(d)]){ completed++; run++; best=Math.max(best,run); } else { run=0; }
  }
  return {completed, possible, best, isCurrent};
}

function makeDefaultState(){
  const s = {
    tab: 'dashboard',
    focusMode: true,
    goalsView: { year: today.getFullYear(), period: Math.floor(today.getMonth()/3)+1 }, // period: 1-4 or 'year'
    habitsView: { year: today.getFullYear(), period: Math.floor(today.getMonth()/3)+1 },
    spendingView: { year: today.getFullYear(), period: Math.floor(today.getMonth()/3)+1 },
    goals: [
      {id:1, title:'Launch side project MVP', pct:40, quarter: currentQuarter(), note:'Ship to 10 beta users', due: isoDate(new Date(today.getTime()+18*86400000))},
      {id:2, title:'Read 6 books', pct:65, quarter: currentQuarter(), note:'2 nonfiction, 4 fiction', due: isoDate(new Date(today.getTime()+40*86400000))},
    ],
    habits: [
      {id:1, name:'Morning workout', log:{}, target:3},
      {id:2, name:'No spending after 8pm', log:{}, target:'daily'},
      {id:3, name:'Journal', log:{}, target:'daily'},
    ],
    txns: [
      {id:1, date: isoDate(today), category:'Groceries', amount:54.20, note:'Weekly shop'},
      {id:2, date: isoDate(new Date(today.getTime()-86400000)), category:'Dining', amount:22.00, note:'Lunch'},
      {id:3, date: isoDate(new Date(today.getTime()-2*86400000)), category:'Transport', amount:14.50, note:'Gas'},
    ],
    categoryBudgets: { Rent: 1250 },
    expenseCategories: ['Rent','Groceries','Dining','Transport','Housing','Fun','Other'],
    income: [
      {id:1, date: isoDate(today), source:'Salary', amount:3200, note:'Biweekly paycheck'},
    ],
    savings: [
      {id:1, name:'Emergency fund', target:5000, saved:1800, due: isoDate(new Date(today.getTime()+150*86400000))},
      {id:2, name:'Trip to Japan', target:2500, saved:650, due: isoDate(new Date(today.getTime()+70*86400000))},
    ],
    dreams: [
      {id:1, emoji:'🏡', text:'Own a home with a garden'},
      {id:2, emoji:'✈️', text:'Backpack through South America'},
      {id:3, emoji:'📚', text:'Write a book someday'},
      {id:4, emoji:'🎨', text:'Take a pottery class'},
    ],
    nextId: {goal:3, habit:4, txn:4, saving:3, dream:5, income:2},
  };
  const d1 = isoDate(new Date(today.getTime()-86400000));
  const d2 = isoDate(new Date(today.getTime()-2*86400000));
  s.habits[0].log[d1]=true;
  s.habits[0].log[d2]=true;
  s.habits[2].log[d1]=true;
  return s;
}
let state = makeDefaultState();

/* ---------- helpers ---------- */
function last7Days(){
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(today.getTime()-i*86400000);
    days.push(d);
  }
  return days;
}
function dayLabel(d){return ['S','M','T','W','T','F','S'][d.getDay()];}
function weekDatesFromOffset(offset){
  const base = weekStartOf(new Date(isoDate(today)+'T00:00:00'));
  const start = new Date(base);
  start.setDate(base.getDate() - offset*7);
  return [...Array(7)].map((_,i)=>{ const d=new Date(start); d.setDate(start.getDate()+i); return d; });
}
function fmtShort(d){ return d.toLocaleDateString(undefined,{month:'short', day:'numeric'}); }
function fmtFull(iso){ return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'}); }
function lastCompletedDate(habit){
  const dates = Object.keys(habit.log).filter(d=>habit.log[d]).sort();
  return dates.length ? dates[dates.length-1] : null;
}
function daysRemaining(dueIso){
  if(!dueIso) return null;
  const due = new Date(dueIso + 'T00:00:00');
  const start = new Date(isoDate(today) + 'T00:00:00');
  return Math.round((due - start) / 86400000);
}
function dueLabel(dueIso){
  const d = daysRemaining(dueIso);
  if(d===null) return {text:'No due date', cls:''};
  if(d < 0) return {text:`${Math.abs(d)} day${Math.abs(d)===1?'':'s'} overdue`, cls:'overdue'};
  if(d === 0) return {text:'Due today', cls:'soon'};
  if(d <= 7) return {text:`${d} day${d===1?'':'s'} left`, cls:'soon'};
  return {text:`${d} days left`, cls:''};
}
function streakFor(habit){
  let count=0;
  for(let i=0;i<365;i++){
    const d=new Date(today.getTime()-i*86400000);
    if(habit.log[isoDate(d)]){count++;} else if(i===0){continue;} else {break;}
  }
  return count;
}
function bestStreakFor(habit){
  const dates = Object.keys(habit.log).filter(d=>habit.log[d]).sort();
  if(!dates.length) return 0;
  let best=1, run=1;
  for(let i=1;i<dates.length;i++){
    const prev = new Date(dates[i-1]+'T00:00:00');
    const cur = new Date(dates[i]+'T00:00:00');
    if((cur-prev)/86400000 === 1){ run++; } else { run=1; }
    if(run>best) best=run;
  }
  return best;
}
function isWeekly(habit){ return typeof habit.target === 'number'; }
function weekStartOf(d){
  const dow = (d.getDay()+6)%7; // Mon=0
  const s = new Date(d);
  s.setDate(d.getDate()-dow);
  s.setHours(0,0,0,0);
  return s;
}
function weekCount(habit, weekStart){
  let c=0;
  for(let i=0;i<7;i++){
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate()+i);
    if(habit.log[isoDate(d)]) c++;
  }
  return c;
}
function thisWeekProgress(habit){
  return weekCount(habit, weekStartOf(new Date(isoDate(today)+'T00:00:00')));
}
function weeklyStreak(habit){
  let streak=0;
  let cursor = weekStartOf(new Date(isoDate(today)+'T00:00:00'));
  for(let i=0;i<104;i++){
    if(weekCount(habit, cursor) >= habit.target){ streak++; } else { break; }
    cursor = new Date(cursor); cursor.setDate(cursor.getDate()-7);
  }
  return streak;
}
function periodStatsWeekly(habit, view){
  const {start,end} = periodRange(view.year, view.period);
  const todayD = new Date(isoDate(today)+'T00:00:00');
  const isCurrent = todayD>=start && todayD<=end;
  if(start > todayD) return {metWeeks:0, totalWeeks:0, isCurrent:false};
  const clipEnd = end < todayD ? end : todayD;
  let ws = weekStartOf(start);
  let metWeeks=0, totalWeeks=0;
  while(ws <= clipEnd){
    totalWeeks++;
    if(weekCount(habit, ws) >= habit.target) metWeeks++;
    ws = new Date(ws); ws.setDate(ws.getDate()+7);
  }
  return {metWeeks, totalWeeks, isCurrent};
}
function habitHeatmapWeeks(habit, view){
  const {start,end} = periodRange(view.year, view.period);
  const todayD = new Date(isoDate(today)+'T00:00:00');
  const clipEnd = end < todayD ? end : todayD;
  if(start > todayD) return [];
  const gridStart = weekStartOf(start);
  const weeks = [];
  let cur = new Date(gridStart);
  while(cur <= clipEnd){
    const week = [];
    for(let i=0;i<7;i++){
      const d = new Date(cur); d.setDate(cur.getDate()+i);
      const iso = isoDate(d);
      week.push({ iso, done: !!habit.log[iso], inPeriod: d>=start && d<=clipEnd });
    }
    weeks.push(week);
    cur.setDate(cur.getDate()+7);
  }
  return weeks;
}
function monthTotal(){
  const ym = isoDate(today).slice(0,7);
  return state.txns.filter(t=>t.date.startsWith(ym)).reduce((s,t)=>s+t.amount,0);
}
function monthIncomeTotal(){
  const ym = isoDate(today).slice(0,7);
  return state.income.filter(i=>i.date.startsWith(ym)).reduce((s,i)=>s+i.amount,0);
}
function periodCategoryTotals(view){
  const {start,end} = periodRange(view.year, view.period);
  const map={};
  state.txns.forEach(t=>{
    const d = new Date(t.date+'T00:00:00');
    if(d>=start && d<=end) map[t.category]=(map[t.category]||0)+t.amount;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function periodTxnTotal(view){
  const {start,end} = periodRange(view.year, view.period);
  return state.txns.reduce((sum,t)=>{
    const d = new Date(t.date+'T00:00:00');
    return (d>=start && d<=end) ? sum+t.amount : sum;
  }, 0);
}
function savingsTotals(){
  return state.savings.reduce((acc,s)=>{acc.saved+=s.saved; acc.target+=s.target; return acc;}, {saved:0,target:0});
}
const dreamAccents = ['gold','teal','rust','sage','plum'];
const INCOME_SOURCES = ['Salary','Freelance','Gift','Refund','Other'];
function categoryMonthSpent(cat){
  const ym = isoDate(today).slice(0,7);
  return state.txns.filter(t=>t.category===cat && t.date.startsWith(ym)).reduce((s,t)=>s+t.amount,0);
}

/* ---------- icons ---------- */
const icons = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>',
  goals:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/></svg>',
  habits:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 6L9 17l-5-5"/></svg>',
  spending:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>',
  dreams:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l1.9 4.9L19 9.3l-3.8 3.4L16.3 18 12 15.3 7.7 18l1.1-5.3L5 9.3l5.1-1.4L12 3z"/></svg>',
};

/* ---------- render ---------- */
function render(){
  document.getElementById('dateline').textContent =
    today.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'}) + ' · ' + currentQuarter();
  document.getElementById('pagetitle').textContent =
    {dashboard:'Home', goals:'Quarterly Goals', habits:'Habits', spending:'Spending', dreams:'Vision Board'}[state.tab];

  const main = document.getElementById('main');
  main.innerHTML = {
    dashboard: renderDashboard,
    goals: renderGoals,
    habits: renderHabits,
    spending: renderSpending,
    dreams: renderDreams,
  }[state.tab]();

  const tabbar = document.getElementById('tabbar');
  tabbar.innerHTML = ['dashboard','goals','habits','spending','dreams'].map(t=>`
    <button data-tab="${t}" class="${state.tab===t?'active':''}">
      ${icons[t]}
      <span>${t==='dashboard'?'Home':t[0].toUpperCase()+t.slice(1)}</span>
    </button>
  `).join('');

  attachEvents();
  scheduleSave();
}

function renderDashboard(){
  const spent = monthTotal();
  const view = state.goalsView;
  const periodGoals = state.goals.filter(g=>{
    const q = parseQuarter(g.quarter);
    if(!q || q.year !== view.year) return false;
    return view.period === 'year' ? true : q.period === view.period;
  });
  const goalsAvg = periodGoals.length ? Math.round(periodGoals.reduce((s,g)=>s+g.pct,0)/periodGoals.length) : 0;
  const activeHabitDays = state.habits.filter(h=>h.log[isoDate(today)]).length;
  const savTotals = savingsTotals();
  const savedPct = savTotals.target ? Math.round((savTotals.saved/savTotals.target)*100) : 0;

  const toggleRow = `
    <div class="focus-toggle">
      <span>Focus mode — show only what's left today</span>
      <button class="switch ${state.focusMode?'on':''}" id="focus-toggle-btn"></button>
    </div>`;

  if(state.focusMode){
    const undoneHabits = state.habits.filter(h=>!h.log[isoDate(today)]);
    const upcomingGoal = state.goals.filter(g=>g.due && g.pct!==100).sort((a,b)=>daysRemaining(a.due)-daysRemaining(b.due))[0];
    const doneCount = state.habits.length - undoneHabits.length;
    const spentNow = monthTotal();
    const incomeNow = monthIncomeTotal();
    const leftToSpendNow = incomeNow - spentNow;
    const realQ = Math.floor(today.getMonth()/3)+1;
    const realY = today.getFullYear();
    const qEnd = periodRange(realY, realQ).end;
    const daysLeftInQuarter = Math.max(0, Math.round((qEnd - new Date(isoDate(today)+'T00:00:00'))/86400000));

    return `
      ${toggleRow}
      <div class="focus-stat-row">
        <div class="focus-stat">
          <div class="num">${doneCount}/${state.habits.length}</div>
          <div class="label">habits</div>
        </div>
        <div class="focus-stat">
          <div class="num">${leftToSpendNow>=0?'':'−'}${fmtMoney(Math.abs(leftToSpendNow))}</div>
          <div class="label">left to spend</div>
        </div>
        <div class="focus-stat">
          <div class="num">${daysLeftInQuarter}</div>
          <div class="label">days in quarter</div>
        </div>
      </div>

      <div class="focus-card">
        <div class="focus-header-row">
          <div class="focus-title">Right now</div>
          <span class="focus-view-link" data-tab="goals">View goals</span>
        </div>
        ${undoneHabits.length ? undoneHabits.map(h=>`
          <div class="focus-habit-row" data-habit-toggle="${h.id}" data-date="${isoDate(today)}">
            <span class="focus-check"></span>
            <span class="focus-habit-name">${escapeHtml(h.name)}</span>
          </div>
        `).join('') : '<div class="focus-done-msg">All habits done for today ✓</div>'}
        ${upcomingGoal ? `<div class="focus-next-line">Next deadline: <strong>${escapeHtml(upcomingGoal.title)}</strong> — ${dueLabel(upcomingGoal.due).text}</div>` : ''}
      </div>

      <div class="focus-card">
        <div class="focus-title">Log an expense</div>
        <input type="number" class="qs-amount-input" id="focus-amount" placeholder="Amount" step="0.01">
        <div class="qs-chip-row">
          ${state.expenseCategories.map(c=>`<button class="qs-chip" data-focus-cat="${c}">${c}</button>`).join('')}
        </div>
      </div>

      <div class="show-full-link" id="show-full-dash">Show full dashboard</div>
    `;
  }

  return `
    ${toggleRow}
    <div class="period-select-wrap">
      <select class="period-select" data-period-target="goals">${periodOptionsHTML(view)}</select>
    </div>

    <div class="snap-grid">
      <div class="stat-card">
        <div class="num">${goalsAvg}%</div>
        <div class="label">Goal progress</div>
      </div>
      <div class="stat-card">
        <div class="num">${activeHabitDays}/${state.habits.length}</div>
        <div class="label">Habits today</div>
      </div>
      <div class="stat-card">
        <div class="num">${fmtMoney(spent)}</div>
        <div class="label">Spent this month</div>
      </div>
      <div class="stat-card">
        <div class="num">${savedPct}%</div>
        <div class="label">Saved of goals</div>
      </div>
    </div>

    <div class="dash-block">
      <h3>Today's habits <span class="tag" data-tab="habits">view all</span></h3>
      ${state.habits.map(h=>{
        const streak = isWeekly(h) ? weeklyStreak(h) : streakFor(h);
        return `
        <div class="mini-row">
          <span>${escapeHtml(h.name)}</span>
          <div style="display:flex;align-items:center;gap:8px;">
            ${streak>0?`<span class="streak-badge lit" style="padding:2px 7px 2px 6px;font-size:12px;">${flameSvg}${streak}</span>`:''}
            <span class="mini-habit-dot ${h.log[isoDate(today)]?'done':''}" data-habit-toggle="${h.id}" data-date="${isoDate(today)}"></span>
          </div>
        </div>
      `;}).join('')}
    </div>

    <div class="dash-block">
      <h3>Goals · ${labelForView(view)} <span class="tag" data-tab="goals">view all</span></h3>
      ${periodGoals.map(g=>{
        const due = dueLabel(g.due);
        const done = g.pct === 100;
        return `
        <div class="mini-row">
          <span style="display:flex;align-items:center;gap:10px;">
            <span class="goal-check ${done?'done':''}" style="width:18px;height:18px;" data-goal-complete="${g.id}" title="${done?'Mark incomplete':'Mark complete'}"></span>
            <span>${escapeHtml(g.title)}<br><span style="font-size:11px;color:${due.cls?'var(--rust)':'var(--ink-soft)'};">${due.text}</span></span>
          </span>
          <span style="color:var(--gold);font-family:'Fraunces',serif;">${done?'Done':g.pct+'%'}</span>
        </div>
      `;}).join('') || `<p class="empty">No goals for ${labelForView(view)} yet.</p>`}
    </div>

    <div class="dash-block">
      <h3>Savings <span class="tag" data-tab="spending">view all</span></h3>
      ${state.savings.map(s=>{
        const pct = Math.min(100, Math.round((s.saved/s.target)*100));
        return `
        <div class="mini-bar-row">
          <div class="mini-bar-label"><span>${escapeHtml(s.name)}</span><span>${pct}%</span></div>
          <div class="mini-track"><div class="mini-fill" style="width:${pct}%"></div></div>
        </div>
      `;}).join('') || '<p class="empty">No savings goals yet.</p>'}
    </div>

    <div class="dash-block">
      <h3>Recent spending <span class="tag" data-tab="spending">view all</span></h3>
      ${state.txns.slice().reverse().slice(0,3).map(t=>`
        <div class="mini-row">
          <span>${t.category}</span>
          <span style="color:var(--rust);">${fmtMoney(t.amount)}</span>
        </div>
      `).join('') || '<p class="empty">No transactions logged yet.</p>'}
    </div>

    <div class="dash-block">
      <h3>Future dreams <span class="tag" data-tab="dreams">view all</span></h3>
      ${state.dreams.length ? `<div class="dream-strip">
        ${state.dreams.slice(0,6).map((d,i)=>`
          <div class="dream-chip dream-card ${dreamAccents[i%5]}">
            <div class="dream-emoji">${d.emoji}</div>
            <div class="dream-text">${escapeHtml(d.text)}</div>
          </div>
        `).join('')}
      </div>` : '<p class="empty">No dreams pinned yet.</p>'}
    </div>

    <div class="settings-footer">
      <div class="backup-row">
        <button class="backup-link" id="download-backup-btn">Download backup</button>
        <span class="settings-divider">·</span>
        <button class="backup-link" id="restore-backup-btn">Restore from backup</button>
        <input type="file" id="restore-file-input" accept="application/json" style="display:none;">
      </div>
      <p class="backup-status" id="backup-status"></p>
      <button class="reset-link ${resetArmed?'armed':''}" id="reset-data-btn">${resetArmed ? 'Tap again to confirm — this clears everything' : 'Reset all data'}</button>
    </div>
  `;
}

function renderGoals(){
  const view = state.goalsView;
  const filtered = state.goals.filter(g=>{
    const q = parseQuarter(g.quarter);
    if(!q || q.year !== view.year) return false;
    return view.period === 'year' ? true : q.period === view.period;
  });

  return `
    <div class="period-select-wrap">
      <select class="period-select" data-period-target="goals">${periodOptionsHTML(view)}</select>
    </div>

    <div class="add-form">
      <input type="text" id="new-goal-title" placeholder="Goal, e.g. Run a half marathon">
      <input type="text" id="new-goal-note" placeholder="Note (optional)">
      <label style="font-size:12px;color:var(--ink-soft);display:block;margin-bottom:4px;">Due date</label>
      <input type="date" id="new-goal-due">
      <button class="btn gold" id="add-goal">Add goal to ${labelForView(view)}</button>
    </div>
    ${filtered.length ? filtered.map(g=>{
      const due = dueLabel(g.due);
      const done = g.pct === 100;
      return `
      <div class="goal-card ${done?'goal-done':''}">
        <div class="goal-top">
          <div style="display:flex;gap:10px;align-items:flex-start;">
            <span class="goal-check ${done?'done':''}" data-goal-complete="${g.id}" title="${done?'Mark incomplete':'Mark complete'}"></span>
            <div>
              <div class="goal-title">${escapeHtml(g.title)}</div>
              ${view.period==='year' ? `<div class="goal-note">${g.quarter}</div>` : ''}
              ${g.note ? `<div class="goal-note">${escapeHtml(g.note)}</div>` : ''}
            </div>
          </div>
          <div style="display:flex;align-items:flex-start;gap:6px;">
            <span class="goal-pct">${done?'Done':g.pct+'%'}</span>
            <button class="del-x" data-del-goal="${g.id}">✕</button>
          </div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${g.pct}%"></div></div>
        <div class="goal-meta">
          <span class="due-pill ${due.cls}">${due.text}</span>
          ${g.due ? `<span class="due-date">${g.due}</span>` : ''}
        </div>
        <div class="goal-controls">
          <input type="range" min="0" max="100" value="${g.pct}" data-goal-slider="${g.id}">
        </div>
      </div>
    `;}).join('') : `<p class="empty">No goals for ${labelForView(view)} yet.</p>`}
  `;
}

let editingHabitId = null;
let habitWeekOffset = 0;
const flameSvg = '<svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><path d="M12 2c1 3-2 4-2 7a4 4 0 108 0c0-1-.5-2-1-2.5.7 2 0 3.5-1.5 4.5C17 9 17 5 14 2c1 3-1 4-2.5 6C10 10 9 12 9 14a3 3 0 006 0c0 3.5-2 6-5 6a6 6 0 01-6-6c0-4 3-6 4-8 .7-1.4 1-2.7 1-4z"/></svg>';

function renderHabits(){
  const weekDates = weekDatesFromOffset(habitWeekOffset);
  const weekLabel = `${fmtShort(weekDates[0])} – ${fmtShort(weekDates[6])}`;
  const view = state.habitsView;
  return `
    <div class="period-select-wrap">
      <select class="period-select" data-period-target="habits">${periodOptionsHTML(view)}</select>
    </div>

    <div class="add-form">
      <input type="text" id="new-habit-name" placeholder="Habit, e.g. Drink 8 glasses of water">
      <select id="new-habit-freq">
        <option value="daily">Daily</option>
        <option value="1">1x / week</option>
        <option value="2">2x / week</option>
        <option value="3">3x / week</option>
        <option value="4">4x / week</option>
        <option value="5">5x / week</option>
        <option value="6">6x / week</option>
      </select>
      <button class="btn teal" id="add-habit">Add habit</button>
    </div>

    <div class="week-nav">
      <button class="icon-btn" data-week-nav="1" title="Previous week">‹</button>
      <span class="week-nav-label">${weekLabel}${habitWeekOffset===0?' · This week':''}</span>
      <button class="icon-btn" data-week-nav="-1" ${habitWeekOffset===0?'disabled':''} title="Next week">›</button>
    </div>

    ${state.habits.length ? state.habits.map((h,idx)=>{
      const weekly = isWeekly(h);
      let badgeVal, badgeOn, badgeTitle, sub;

      if(weekly){
        const wstats = periodStatsWeekly(h, view);
        const streak = weeklyStreak(h);
        badgeVal = wstats.isCurrent ? streak : wstats.metWeeks;
        badgeOn = badgeVal > 0;
        badgeTitle = wstats.isCurrent ? 'Weeks in a row hitting target' : 'Weeks target was met in '+labelForView(view);
        sub = wstats.totalWeeks
          ? `This week: ${thisWeekProgress(h)}/${h.target} · met ${wstats.metWeeks}/${wstats.totalWeeks} weeks · ${labelForView(view)}`
          : `No data for ${labelForView(view)} yet`;
      } else {
        const streak = streakFor(h);
        const stats = periodStats(h, view);
        badgeVal = stats.isCurrent ? streak : stats.best;
        badgeOn = badgeVal > 0;
        badgeTitle = stats.isCurrent ? 'Current streak' : 'Best streak in '+labelForView(view);
        sub = stats.possible
          ? `${stats.completed}/${stats.possible} days · ${labelForView(view)}${stats.isCurrent ? '' : ' · best '+stats.best}`
          : `No data for ${labelForView(view)} yet`;
      }

      const lastDone = lastCompletedDate(h);
      const weeks = habitHeatmapWeeks(h, view);
      const todayD = new Date(isoDate(today)+'T00:00:00');

      return `
      <div class="habit-card">
        <div class="habit-top">
          <div class="reorder-col">
            <button class="icon-btn" data-move-habit="${h.id}" data-dir="-1" ${idx===0?'disabled':''} title="Move up">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
            </button>
            <button class="icon-btn" data-move-habit="${h.id}" data-dir="1" ${idx===state.habits.length-1?'disabled':''} title="Move down">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </div>
          <div style="flex:1;">
            <div class="habit-name-row">
              ${editingHabitId===h.id
                ? `<input class="habit-name-input" id="edit-habit-input" value="${escapeHtml(h.name)}">
                   <button class="icon-btn" data-save-habit="${h.id}" title="Save">
                     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
                   </button>`
                : `<div class="habit-name">${escapeHtml(h.name)}</div>
                   <button class="icon-btn" data-edit-habit="${h.id}" title="Rename">
                     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
                   </button>`
              }
            </div>
            <span class="freq-pill">${weekly ? h.target+'x / week' : 'Daily'}</span>
            <div class="habit-streak">${sub}<br>Last done: ${lastDone ? fmtFull(lastDone) : '—'}</div>
          </div>
          <div style="display:flex;align-items:flex-start;gap:6px;">
            <span class="streak-badge ${badgeOn?'lit':''}" title="${badgeTitle}">
              ${flameSvg}
              ${badgeVal}
            </span>
            <button class="del-x" data-del-habit="${h.id}">✕</button>
          </div>
        </div>
        <div class="week-row">
          ${weekDates.map(d=>{
            const iso = isoDate(d);
            const done = !!h.log[iso];
            const isFuture = d > todayD;
            return `<div class="day-box">
              <div class="day-dot ${done?'done':''} ${isFuture?'future':''}" ${isFuture?'':`data-habit-toggle="${h.id}" data-date="${iso}"`} title="${fmtFull(iso)}"></div>
              ${dayLabel(d)}
              <div class="day-num">${d.getDate()}</div>
            </div>`;
          }).join('')}
        </div>
        ${weeks.length ? `
        <div class="heatmap-label">History · ${labelForView(view)} · tap a day to toggle it</div>
        <div class="heatmap">
          ${weeks.map(week=>`<div class="heat-row">${week.map(day=>`<span class="heat-cell ${!day.inPeriod ? 'blank' : (day.done?'done':'')}" ${day.inPeriod?`data-habit-toggle="${h.id}" data-date="${day.iso}"`:''} title="${day.inPeriod ? fmtFull(day.iso)+(day.done?' — done':' — not done') : ''}"></span>`).join('')}</div>`).join('')}
        </div>` : ''}
      </div>
    `;}).join('') : '<p class="empty">No habits yet. Add one above to start tracking.</p>'}
  `;
}

let spendingSubView = 'overview';
let showTxnForm = false;
let showSavingForm = false;

function renderSpending(){
  return `
    <div class="segmented">
      <button class="segment-btn ${spendingSubView==='overview'?'active':''}" data-spend-sub="overview">Overview</button>
      <button class="segment-btn ${spendingSubView==='transactions'?'active':''}" data-spend-sub="transactions">Transactions</button>

}

let showBudgetForm = false;
let showCategoryManager = false;
let showIncomeForm = false;

  const leftToSpend = income - spent;
  const view = state.spendingView;
  const qTotal = periodTxnTotal(view);
  const qCats = periodCategoryTotals(view);
  const qMax = qCats.length ? qCats[0][1] : 1;
  const budgetEntries = Object.entries(state.categoryBudgets);
  return `
    <div class="stat-card hero" style="margin-bottom:10px;">
      <div class="num" style="color:${leftToSpend>=0?'var(--sage)':'#A5291E'};">${leftToSpend>=0?'':'−'}${fmtMoney(Math.abs(leftToSpend))}</div>
      <div class="label">Left to spend this month</div>
    </div>
    <div class="spend-summary" style="margin-bottom:16px;">
      <div class="stat-card">
        <div class="num">${fmtMoney(spent)}</div>
        <div class="label">Spent so far</div>
      </div>
      <div class="stat-card">
        <div class="num">${fmtMoney(income)}</div>
        <div class="label">Income this month</div>
      </div>
    </div>

    <p class="section-title">Budgets by category</p>
    ${budgetEntries.length ? budgetEntries.map(([cat,budget])=>{

      return `
      <div class="budget-row">
        <div class="cat-bar-label">
          <span>${cat}</span>
          <span>
            <button class="del-x" data-del-budget="${cat}">✕</button>
            ${over ? `<span style="color:#A5291E;font-weight:600;">${fmtMoney(Math.abs(remaining))} over</span>` : `<span>${fmtMoney(remaining)} left</span>`}
          </span>
        </div>
        <div class="cat-track"><div class="cat-fill ${over?'over':''}" style="width:${pct}%"></div></div>
        <div class="cat-sub ${over?'over':''}">${fmtMoney(catSpent)} of ${fmtMoney(budget)} spent this month</div>
      </div>
    `;}).join('') : '<p class="empty">No category budgets set yet.</p>'}

    ${showBudgetForm ? `
      <div class="add-form">
        <div class="row2">
          <select id="new-budget-cat">${state.expenseCategories.map(c=>`<option>${c}</option>`).join('')}</select>
          <input type="number" id="new-budget-amount" placeholder="Monthly $" step="0.01">
        </div>
        <button class="btn rust" id="set-budget">Set budget</button>
        <button class="qs-close-btn" id="cancel-budget-form" style="margin-top:8px;">Cancel</button>
      </div>
    ` : `<div class="add-toggle" id="toggle-budget-form">+ Set a category budget</div>`}

    ${showCategoryManager ? `
      <p class="section-title">Categories</p>
      <div class="add-form">
        <div class="row2">

          <button class="btn rust" id="remove-category" style="width:auto;padding:0 16px;" ${state.expenseCategories.length<=1?'disabled title="At least one category is required"':''}>Remove</button>
        </div>
        <input type="text" id="new-category-name" placeholder="New category name">
        <button class="btn rust" id="add-category">Add category</button>
        <button class="qs-close-btn" id="cancel-category-manager" style="margin-top:8px;">Close</button>
      </div>
    ` : `<div class="add-toggle" id="toggle-category-manager">+ Manage categories</div>`}

    <p class="section-title">By category</p>
    <div class="period-select-wrap">
      <select class="period-select" data-period-target="spending">${periodOptionsHTML(view)}</select>
    </div>
    <div class="stat-card" style="margin-bottom:14px;">
      <div class="num">${fmtMoney(qTotal)}</div>
      <div class="label">Total spent · ${labelForView(view)}</div>
    </div>
    ${qCats.length ? qCats.map(([cat,amt])=>`
      <div class="cat-bar-row">
        <div class="cat-bar-label"><span>${cat}</span><span>${fmtMoney(amt)}</span></div>
        <div class="cat-track"><div class="cat-fill" style="width:${Math.round((amt/qMax)*100)}%"></div></div>
      </div>
    `).join('') : `<p class="empty">No spending logged for ${labelForView(view)} yet.</p>`}
  `;
}

let editingLedgerKey = null;

function renderTransactionsSub(){
  const merged = [
    ...state.txns.map(t=>({ id:t.id, date:t.date, label:t.category, note:t.note, amount:t.amount, kind:'expense' })),
    ...state.income.map(i=>({ id:i.id, date:i.date, label:i.source, note:i.note, amount:i.amount, kind:'income' })),
  ].sort((a,b)=> a.date === b.date ? b.id - a.id : (a.date < b.date ? 1 : -1));

  return `
    <p class="section-title" style="margin-top:0;">Recent</p>
    ${merged.length ? merged.slice(0,12).map(x=>{
      const key = `${x.kind}:${x.id}`;
      const isEditing = editingLedgerKey === key;
      if(isEditing){
        const baseOptions = x.kind==='expense' ? state.expenseCategories : INCOME_SOURCES;
        const options = baseOptions.includes(x.label) ? baseOptions : [x.label, ...baseOptions];
        return `
        <div class="txn-row-edit">
          <div class="row2">
            <input type="number" id="edit-ledger-amt" value="${x.amount}" step="0.01">
            <select id="edit-ledger-cat">${options.map(c=>`<option ${c===x.label?'selected':''}>${c}</option>`).join('')}</select>
          </div>
          <div class="row2">
            <input type="date" id="edit-ledger-date" value="${x.date}">
            <input type="text" id="edit-ledger-note" value="${escapeHtml(x.note||'')}" placeholder="Note (optional)">
          </div>
          <div class="row2">
            <button class="btn ${x.kind==='income'?'sage':'rust'} small" data-save-ledger="${key}">Save</button>
            <button class="qs-close-btn" id="cancel-ledger-edit" style="margin-top:0;">Cancel</button>
          </div>
        </div>`;
      }
      return `
      <div class="txn-row">
        <div class="txn-left">
          <div class="txn-cat">${x.label}</div>
          <div class="txn-note">${escapeHtml(x.note || '')} ${x.date}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="txn-amt" style="color:${x.kind==='income'?'var(--sage)':'var(--rust)'};">${x.kind==='income'?'+':'−'}${fmtMoney(x.amount)}</div>
          <button class="icon-btn" data-edit-ledger="${key}" title="Edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
          </button>
          <button class="del-x" data-del-${x.kind==='income'?'income':'txn'}="${x.id}">✕</button>
        </div>
      </div>
    `;}).join('') : '<p class="empty">No transactions yet.</p>'}

    ${showTxnForm ? `
      <p class="section-title">Log an expense</p>
      <div class="add-form">
        <div class="row2">
          <input type="number" id="new-txn-amount" placeholder="Amount" step="0.01">
          <select id="new-txn-cat">${state.expenseCategories.map(c=>`<option>${c}</option>`).join('')}</select>
        </div>
        <input type="date" id="new-txn-date" value="${isoDate(today)}">
        <input type="text" id="new-txn-note" placeholder="Note (optional)">
        <button class="btn rust" id="add-txn">Add expense</button>
        <button class="qs-close-btn" id="cancel-txn-form" style="margin-top:8px;">Cancel</button>
      </div>
    ` : `<div class="add-toggle" id="toggle-txn-form">+ Log an expense</div>`}

    ${showIncomeForm ? `
      <p class="section-title">Log income</p>
      <div class="add-form">
        <div class="row2">
          <input type="number" id="new-income-amount" placeholder="Amount" step="0.01">
          <select id="new-income-source">${INCOME_SOURCES.map(s=>`<option>${s}</option>`).join('')}</select>
        </div>
        <input type="date" id="new-income-date" value="${isoDate(today)}">
        <input type="text" id="new-income-note" placeholder="Note (optional)">
        <button class="btn sage" id="add-income">Add income</button>
        <button class="qs-close-btn" id="cancel-income-form" style="margin-top:8px;">Cancel</button>
      </div>
    ` : `<div class="add-toggle" id="toggle-income-form">+ Log income</div>`}
  `;
}

let editingSavingId = null;

function renderSavingsSub(){
  return `
    ${state.savings.length ? state.savings.map(s=>{
      if(editingSavingId === s.id){
        return `
        <div class="txn-row-edit">
          <div class="row2">
            <input type="text" id="edit-saving-name" value="${escapeHtml(s.name)}" placeholder="What are you saving for?">
            <input type="number" id="edit-saving-target" value="${s.target}" step="0.01" placeholder="Target $">

            <div class="savings-name">${escapeHtml(s.name)}</div>

          <div style="display:flex;align-items:flex-start;gap:6px;">
            <span class="savings-amt">${pct}%</span>
            <button class="icon-btn" data-edit-saving="${s.id}" title="Edit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
            </button>
            <button class="del-x" data-del-saving="${s.id}">✕</button>
          </div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--sage);"></div></div>
        <div class="goal-meta">
          <span class="due-pill ${due.cls}">${due.text}</span>
          ${s.due ? `<span class="due-date">${s.due}</span>` : ''}
        </div>
        <div class="savings-controls">
          <input type="number" placeholder="Add amount" step="0.01" id="contrib-${s.id}">
          <button class="btn sage small" data-add-contrib="${s.id}">Add</button>
        </div>

    ${showSavingForm ? `
      <p class="section-title">Add savings goal</p>
      <div class="add-form">
        <div class="row2">
          <input type="text" id="new-saving-name" placeholder="What are you saving for?">
          <input type="number" id="new-saving-target" placeholder="Target $" step="0.01">
        </div>
        <label style="font-size:12px;color:var(--ink-soft);display:block;margin-bottom:4px;">Target date (optional)</label>
        <input type="date" id="new-saving-due">
        <button class="btn sage" id="add-saving">Add savings goal</button>
        <button class="qs-close-btn" id="cancel-saving-form" style="margin-top:8px;">Cancel</button>
      </div>
    ` : `<div class="add-toggle" id="toggle-saving-form">+ Add a savings goal</div>`}
  `;
}

let dreamEmoji = '✨';
const emojiOptions = ['✨','🏡','✈️','📚','🎨','🎵','🚀','🌱','☕','🎬','🧘','🐾'];

function renderDreams(){
  return `
    <p class="section-title" style="margin-top:0;">Things you're dreaming toward — no deadline, just direction.</p>
    <div class="add-form">
      <input type="text" id="new-dream-text" placeholder="A dream, e.g. Learn to sail">

      </div>
      <button class="btn plum" id="add-dream">Pin to vision board</button>
